name: Lint & Syntax Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8 (Syntax errors & undefined names)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv

    - name: Run unit tests
      env:
        PYTHONPATH: .
      run: |
        set -o pipefail
        python -m unittest discover -s tests -t . -v 2>&1 | tee test_output.log || {
          grep -A 10 -E "(FAIL|ERROR): " test_output.log | head -n 12 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 8 test_output.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
        }

    - name: Upload test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-log-${{ matrix.python-version }}
        path: test_output.log
